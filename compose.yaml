name: minicommerce
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: minicommerce
      POSTGRES_USER: minicommerce
      POSTGRES_PASSWORD: minicommerce
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
      TZ: UTC
      PGTZ: UTC
    command: [postgres, -c, timezone=UTC, -c, "datestyle=ISO,YMD", -c, lc_monetary=C, -c, lc_numeric=C, -c, lc_time=C]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/workspace/db:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U minicommerce -d minicommerce"]
      interval: 2s
      timeout: 5s
      retries: 30
    shm_size: 256mb
volumes:
  postgres_data:
