# Local-only override. compose.yaml HIC degistirilmedi.
#
# 1) ports: host 5433'u sistemde kurulu PostgreSQL 16 tutuyor -> host tarafi 5434.
# 2) volumes: postgres:18+ imajlari PGDATA'yi /var/lib/postgresql/<major>/docker
#    altinda tutuyor ve /var/lib/postgresql/data'ya yapilan mount'u reddedip
#    hata veriyor. 18+ icin tek mount /var/lib/postgresql olmali.
#
# !override tag'i listeyi birlestirmek yerine tamamen degistirir; bu yuzden
# /sql bind mount'u burada yeniden bildirilmek zorunda.
services:
  postgres:
    ports: !override
      - "5434:5432"
    volumes: !override
      - commerceops_data:/var/lib/postgresql
      - ./commerceops:/sql:ro
